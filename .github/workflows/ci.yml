name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is the *test adapter*. The product path is local Chrome/CDP
      # (OMNI_TAB_RUNTIME unset → cdp); CI has no desktop Chrome, so it
      # forces the adapter. The HTTP contract is identical either way.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          OMNI_TAB_RUNTIME: playwright

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
